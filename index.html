<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3763">
  <meta name="description"
        content="CITEguía - Orientación tecnológica para productores y empresarios.">

  <title>CITEguía | Orientación tecnológica</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="shell">

    <aside class="sidebar">

      <div class="brand">
        <div>
          <h1>CITEguía</h1>
          <p>Orientación tecnológica</p>
        </div>
      </div>

      <div class="side-content">
        <h2>Tu necesidad, nuestra orientación.</h2>

        <p>
          Cuéntanos qué quieres mejorar en tu actividad
          productiva. Te ayudaremos a identificar una
          ruta de orientación tecnológica.
        </p>
      </div>

      <button
        class="reset-side"
        id="resetSide"
        type="button">
        ↻ Nueva conversación
      </button>

    </aside>

    <section class="chat" aria-label="Chatbot CITEguía">

      <header class="chat-head">

        <div class="avatar">✦</div>

        <div>
          <strong>Asistente CITEguía</strong>
        </div>

        <button
          class="head-reset"
          id="resetTop"
          type="button"
          title="Reiniciar conversación">
          ↻ Reiniciar
        </button>

      </header>

      <div
        class="messages"
        id="messages"
        role="log"
        aria-live="polite"
        aria-relevant="additions">
      </div>

      <div class="composer">

        <form id="inputForm">

          <label class="sr-only" for="messageInput">
            Escribe tu mensaje
          </label>

          <input
            id="messageInput"
            type="text"
            autocomplete="off"
            placeholder="Escribe tu necesidad productiva..."
            maxlength="500"
            required>

          <button
            id="sendBtn"
            type="submit"
            aria-label="Enviar mensaje">
            ➤
          </button>

        </form>

      </div>

    </section>

  </main>

  <script src="js/chatbot.js?v=0.2.1" defer></script>
</body>
</html>
